<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scan QR Code</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#f6f8fb;
    color:#1e293b;
    min-height:100vh;
    overflow-x:hidden;
}

/* BACKGROUND */

.bg{
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
    opacity:.45;
    z-index:0;
    pointer-events:none;
}

.bg1{
    width:320px;
    height:320px;
    background:#c7d2fe;
    top:-100px;
    left:-100px;
}

.bg2{
    width:320px;
    height:320px;
    background:#fde68a;
    bottom:-100px;
    right:-100px;
}

/* CONTAINER */

.container{
    position:relative;
    z-index:2;
    max-width:650px;
    margin:auto;
    padding:30px 20px;
}

/* HEADER */

.title{
    margin-bottom:25px;
}

.title h1{
    font-size:34px;
    color:#0f172a;
    margin-bottom:8px;
}

.title p{
    color:#64748b;
    font-size:14px;
}

/* CARD */

.card{
    background:rgba(255,255,255,0.82);
    backdrop-filter:blur(20px);
    border-radius:30px;
    border:1px solid rgba(255,255,255,0.7);
    box-shadow:
        0 20px 40px rgba(15,23,42,0.06),
        0 2px 10px rgba(15,23,42,0.04);
    padding:35px;
}

/* INFO BOX */

.info-box{
    background:#eef2ff;
    color:#4338ca;
    padding:18px;
    border-radius:18px;
    margin-bottom:25px;
    font-size:14px;
    line-height:1.6;
}

/* CAMERA */

#reader{
    width:100%;
    overflow:hidden;
    border-radius:24px;
    margin-bottom:25px;
}

/* INPUT */

.input-group{
    margin-bottom:22px;
}

.input-group label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:10px;
    color:#475569;
}

.input-group input{
    width:100%;
    height:58px;
    border-radius:18px;
    border:1px solid #e2e8f0;
    background:rgba(255,255,255,0.9);
    padding:0 18px;
    font-size:16px;
    outline:none;
    transition:.25s;
}

.input-group input:focus{
    border-color:#6366f1;
    box-shadow:0 0 0 4px rgba(99,102,241,.12);
}

/* BUTTON */

.submit-btn{
    width:100%;
    height:58px;
    border:none;
    border-radius:18px;
    background:linear-gradient(135deg,#818cf8,#6366f1);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.25s;
}

.submit-btn:hover{
    transform:translateY(-2px);
}

/* STATUS */

.status-message{
    margin-top:20px;
    padding:16px;
    border-radius:18px;
    font-size:14px;
    font-weight:500;
    display:none;
}

.status-success{
    background:#dcfce7;
    color:#166534;
}

.status-error{
    background:#fee2e2;
    color:#991b1b;
}

/* MOBILE */

@media(max-width:700px){

    .container{
        padding:20px 14px;
    }

    .title h1{
        font-size:28px;
    }

    .card{
        padding:24px;
        border-radius:24px;
    }

}

</style>

</head>

<body>

<div class="bg bg1"></div>
<div class="bg bg2"></div>

<div class="container">

    <!-- HEADER -->

    <div class="title">

        <h1>Scan QR Code</h1>

        <p>
            Camera scanner opens automatically
        </p>

    </div>

    <!-- CARD -->

    <div class="card">

        <div class="info-box">
            Point camera towards QR code or enter code manually below.
        </div>

        <!-- CAMERA -->

        <div id="reader"></div>

        <!-- MANUAL ENTRY -->

        <div class="input-group">

            <label>Enter QR Code Manually</label>

            <input
                type="text"
                id="manual-code"
                placeholder="Enter QR code"
                maxlength="20"
            >

        </div>

        <button id="enter-code-btn" class="submit-btn">
            Submit QR Code
        </button>

        <div id="status-message" class="status-message"></div>

    </div>

</div>

<script>

const statusMessage =
    document.getElementById('status-message');

let html5QrCode = null;

let isProcessing = false;



// ============================
// SHOW STATUS
// ============================

function showMessage(message,type='success'){

    statusMessage.style.display = 'block';

    statusMessage.className =
        `status-message ${
            type === 'success'
                ? 'status-success'
                : 'status-error'
        }`;

    statusMessage.textContent = message;

}



// ============================
// SUBMIT QR
// ============================

async function submitQRCode(qrCode){

    if(isProcessing){
        return;
    }

    if (!qrCode) {

        showMessage(
            'Please enter a QR code.',
            'error'
        );

        return;
    }

    isProcessing = true;

    try {

        // STOP CAMERA IMMEDIATELY
        // SO SAME QR DOESN'T SCAN AGAIN

        if(html5QrCode){

            try{
                await html5QrCode.stop();
            }catch(e){}

        }

        const response = await fetch('/user/scan-qr', {

            method:'POST',

            headers:{
                'Content-Type':'application/json',
            },

            body:JSON.stringify({ qrCode }),

        });

        const result = await response.json();

        if(result.success){

            showMessage(
                `${result.message} Points added: ${result.points}`,
                'success'
            );

            document.getElementById('manual-code').value = '';

        } else {

            showMessage(
                result.message,
                'error'
            );

        }

    } catch(error){

        console.error(error);

        showMessage(
            'Error scanning QR Code.',
            'error'
        );

    }

}



// ============================
// MANUAL SUBMIT
// ============================

document
.getElementById('enter-code-btn')
.addEventListener('click', async () => {

    const qrCode =
        document
        .getElementById('manual-code')
        .value
        .trim();

    submitQRCode(qrCode);

});



// ============================
// AUTO CAMERA START
// ============================

async function startScanner(){

    try{

        html5QrCode =
            new Html5Qrcode("reader");

        const cameras =
            await Html5Qrcode.getCameras();

        if(!cameras || cameras.length === 0){

            showMessage(
                'No camera found.',
                'error'
            );

            return;
        }

        // REAR CAMERA PREFERENCE

        let rearCamera =
            cameras.find(camera =>
                camera.label
                .toLowerCase()
                .includes('back')
            );

        if(!rearCamera){
            rearCamera = cameras[0];
        }

        await html5QrCode.start(

            rearCamera.id,

            {
                fps:5,
                qrbox:250
            },

            async (decodedText) => {

                if(isProcessing){
                    return;
                }

                document
                .getElementById('manual-code')
                .value = decodedText;

                submitQRCode(decodedText);

            },

            (errorMessage) => {
                // Ignore scan errors
            }

        );

    }catch(err){

        console.error(err);

        showMessage(
            'Camera permission denied or camera not found.',
            'error'
        );

    }

}



// START CAMERA AUTOMATICALLY

startScanner();

</script>

</body>

</html>
