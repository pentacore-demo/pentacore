<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scan QR Code</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#f6f8fb;
    color:#1e293b;
    min-height:100vh;
    overflow-x:hidden;
}

/* BACKGROUND */

.bg{
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
    opacity:.45;
    z-index:0;
    pointer-events:none;
}

.bg1{
    width:320px;
    height:320px;
    background:#c7d2fe;
    top:-100px;
    left:-100px;
}

.bg2{
    width:320px;
    height:320px;
    background:#fde68a;
    bottom:-100px;
    right:-100px;
}

/* CONTAINER */

.container{
    position:relative;
    z-index:2;
    max-width:650px;
    margin:auto;
    padding:30px 20px;
}

/* HEADER */

.title{
    margin-bottom:25px;
}

.title h1{
    font-size:34px;
    color:#0f172a;
    margin-bottom:8px;
}

.title p{
    color:#64748b;
    font-size:14px;
}

/* CARD */

.card{
    background:rgba(255,255,255,0.82);
    backdrop-filter:blur(20px);
    border-radius:30px;
    border:1px solid rgba(255,255,255,0.7);
    box-shadow:
        0 20px 40px rgba(15,23,42,0.06),
        0 2px 10px rgba(15,23,42,0.04);
    padding:35px;
}

/* INFO */

.info-box{
    background:#eef2ff;
    color:#4338ca;
    padding:18px;
    border-radius:18px;
    margin-bottom:25px;
    font-size:14px;
    line-height:1.6;
}

/* CAMERA */

#reader{
    width:100%;
    overflow:hidden;
    border-radius:24px;
    border:2px solid #e2e8f0;
    background:white;
    margin-bottom:25px;
}

/* INPUT */

.input-group{
    margin-top:10px;
    margin-bottom:22px;
}

.input-group label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:10px;
    color:#475569;
}

.input-group input{
    width:100%;
    height:58px;
    border-radius:18px;
    border:1px solid #e2e8f0;
    background:rgba(255,255,255,0.9);
    padding:0 18px;
    font-size:16px;
    outline:none;
    transition:.25s;
}

.input-group input:focus{
    border-color:#6366f1;
    box-shadow:0 0 0 4px rgba(99,102,241,.12);
}

/* BUTTON */

.submit-btn{
    width:100%;
    height:58px;
    border:none;
    border-radius:18px;
    background:linear-gradient(135deg,#818cf8,#6366f1);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.25s;
}

.submit-btn:hover{
    transform:translateY(-2px);
}

/* STATUS */

.status-message{
    margin-top:20px;
    padding:16px;
    border-radius:18px;
    font-size:14px;
    font-weight:500;
    display:none;
}

.status-success{
    background:#dcfce7;
    color:#166534;
}

.status-error{
    background:#fee2e2;
    color:#991b1b;
}

/* MOBILE */

@media(max-width:700px){

    .container{
        padding:20px 14px;
    }

    .title h1{
        font-size:28px;
    }

    .card{
        padding:24px;
        border-radius:24px;
    }

}

</style>

</head>

<body>

<div class="bg bg1"></div>
<div class="bg bg2"></div>

<div class="container">

    <!-- HEADER -->

    <div class="title">

        <h1>Scan QR Code</h1>

        <p>
            Camera scanner opens automatically
        </p>

    </div>

    <!-- CARD -->

    <div class="card">

        <div class="info-box">
            Point your camera at the QR code to scan instantly or enter the code manually below.
        </div>

        <!-- CAMERA -->

        <div id="reader"></div>

        <!-- MANUAL INPUT -->

        <div class="input-group">

            <label>Enter QR Code Manually</label>

            <input
                type="text"
                id="manual-code"
                placeholder="Enter QR code"
                maxlength="20"
            >

        </div>

        <button id="enter-code-btn" class="submit-btn">
            Submit QR Code
        </button>

        <div id="status-message" class="status-message"></div>

    </div>

</div>

<script>

const statusMessage =
    document.getElementById('status-message');



// ============================
// SUBMIT QR
// ============================

async function submitQRCode(qrCode){

    if (!qrCode) {

        statusMessage.style.display = 'block';

        statusMessage.className =
            'status-message status-error';

        statusMessage.textContent =
            'Please enter a QR code.';

        return;
    }

    try {

        const response = await fetch('/user/scan-qr', {

            method:'POST',

            headers:{
                'Content-Type':'application/json',
            },

            body:JSON.stringify({ qrCode }),

        });

        const result = await response.json();

        statusMessage.style.display = 'block';

        if(result.success){

            statusMessage.className =
                'status-message status-success';

            statusMessage.textContent =
                `${result.message} Points added: ${result.points}`;

            document.getElementById('manual-code').value = '';

        } else {

            statusMessage.className =
                'status-message status-error';

            statusMessage.textContent =
                result.message;
        }

    } catch(error){

        console.error(error);

        statusMessage.style.display = 'block';

        statusMessage.className =
            'status-message status-error';

        statusMessage.textContent =
            'Error scanning QR Code.';
    }

}



// ============================
// MANUAL SUBMIT
// ============================

document
.getElementById('enter-code-btn')
.addEventListener('click', async () => {

    const qrCode =
        document
        .getElementById('manual-code')
        .value
        .trim();

    submitQRCode(qrCode);

});



// ============================
// AUTO CAMERA SCANNER
// ============================

const html5QrCode = new Html5Qrcode("reader");

async function startScanner(){

    try{

        const cameras =
            await Html5Qrcode.getCameras();

        if(!cameras || cameras.length === 0){

            statusMessage.style.display = 'block';

            statusMessage.className =
                'status-message status-error';

            statusMessage.textContent =
                'No camera found.';

            return;
        }

        let rearCameraId = cameras[0].id;

        cameras.forEach(camera => {

            const label =
                camera.label.toLowerCase();

            if(
                label.includes('back') ||
                label.includes('rear') ||
                label.includes('environment')
            ){
                rearCameraId = camera.id;
            }

        });

        await html5QrCode.start(

            rearCameraId,

            {
                fps:10,
                qrbox:250,
                aspectRatio:1
            },

            async (decodedText) => {

                document
                .getElementById('manual-code')
                .value = decodedText;

                await submitQRCode(decodedText);

            },

            (errorMessage) => {
                // ignore errors while scanning
            }

        );

    }catch(error){

        console.error(error);

        statusMessage.style.display = 'block';

        statusMessage.className =
            'status-message status-error';

        statusMessage.textContent =
            'Camera permission denied or camera not available.';
    }

}



// START CAMERA AUTOMATICALLY

window.addEventListener('load', () => {

    startScanner();

});

</script>

</body>

</html>
