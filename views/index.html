<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#f6f8fb;
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* BACKGROUND */

.bg{
    position:absolute;
    border-radius:50%;
    filter:blur(100px);
    opacity:.45;
    z-index:0;
}

.bg1{
    width:340px;
    height:340px;
    background:#c7d2fe;
    top:-120px;
    left:-120px;
}

.bg2{
    width:340px;
    height:340px;
    background:#fde68a;
    bottom:-120px;
    right:-120px;
}

/* MAIN CARD */

.login-wrapper{
    position:relative;
    z-index:2;
    width:100%;
    max-width:460px;
    padding:20px;
}

.login-card{
    background:rgba(255,255,255,0.82);
    backdrop-filter:blur(22px);
    border-radius:34px;
    padding:38px;
    border:1px solid rgba(255,255,255,0.7);
    box-shadow:
        0 20px 40px rgba(15,23,42,0.08),
        0 2px 10px rgba(15,23,42,0.04);
}

/* LOGO */

.logo-container{
    text-align:center;
    margin-bottom:28px;
}

.logo{
    width:110px;
    object-fit:contain;
}

/* HEADINGS */

.heading{
    text-align:center;
    margin-bottom:8px;
    font-size:32px;
    font-weight:700;
    color:#0f172a;
}

.sub-heading{
    text-align:center;
    color:#64748b;
    font-size:14px;
    margin-bottom:32px;
}

/* INPUT */

.input-group{
    margin-bottom:20px;
}

.input-field{
    width:100%;
    height:58px;
    border-radius:20px;
    border:1px solid #e2e8f0;
    background:rgba(255,255,255,0.85);
    padding:0 18px;
    font-size:15px;
    outline:none;
    transition:.25s;
    color:#0f172a;
}

.input-field:focus{
    border-color:#6366f1;
    box-shadow:0 0 0 4px rgba(99,102,241,.12);
}

/* BUTTON */

.action-btn{
    width:100%;
    height:58px;
    border:none;
    border-radius:20px;
    background:linear-gradient(135deg,#818cf8,#6366f1);
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.25s;
}

.action-btn:hover{
    transform:translateY(-2px);
}

/* MESSAGE */

.success-message{
    margin-top:14px;
    color:#16a34a;
    font-size:14px;
    text-align:center;
    font-weight:500;
}

.error-message{
    margin-top:14px;
    color:#dc2626;
    font-size:14px;
    text-align:center;
    font-weight:500;
}

/* HELP */

.help-section{
    margin-top:30px;
    text-align:center;
}

.help-section p{
    color:#64748b;
    margin-bottom:14px;
    font-size:14px;
}

.whatsapp-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    height:56px;
    border:none;
    border-radius:20px;
    background:#25D366;
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.25s;
}

.whatsapp-btn:hover{
    transform:translateY(-2px);
}

.whatsapp-logo{
    width:24px;
    height:24px;
}

/* MOBILE */

@media(max-width:600px){

    body{
        overflow:auto;
        padding:18px 0;
    }

    .login-wrapper{
        padding:14px;
    }

    .login-card{
        padding:28px 22px;
        border-radius:28px;
    }

    .heading{
        font-size:28px;
    }

    .sub-heading{
        font-size:13px;
    }

    .logo{
        width:95px;
    }

    .input-field,
    .action-btn,
    .whatsapp-btn{
        height:54px;
        border-radius:18px;
    }

    .bg1,
    .bg2{
        width:220px;
        height:220px;
    }

}

</style>

</head>

<body>

<div class="bg bg1"></div>
<div class="bg bg2"></div>

<div class="login-wrapper">

    <div class="login-card">

        <!-- LOGO -->

        <div class="logo-container">

            <img
                src="/admin/images/jlpuraskar.png"
                alt="Logo"
                class="logo"
            >

        </div>

        <!-- HEADING -->

        <h1 class="heading">
            Welcome 
        </h1>

        <p class="sub-heading">
            Login or register to continue
        </p>

        <!-- FORM -->

        <form
            id="otpForm"
            action="/user/verify-otp"
            method="POST"
        >

            <!-- MOBILE SECTION -->

            <div id="mobileSection">

                <div class="input-group">

                    <input
                        type="tel"
                        id="mobileNumber"
                        name="mobileNumber"
                        class="input-field"
                        placeholder="Enter Mobile Number"
                        required
                        maxlength="10"
                        pattern="\d{10}"
                    >

                </div>

                <button
                    type="button"
                    id="sendOtpBtn"
                    class="action-btn"
                >
                    Send OTP
                </button>

                <p
                    id="otpMessage"
                    class="success-message"
                    style="display:none;"
                >
                    OTP sent successfully!
                </p>

            </div>

            <!-- OTP SECTION -->

            <div
                id="otpSection"
                style="display:none;"
            >

                <div class="input-group">

                    <input
                        type="text"
                        id="otp"
                        name="otp"
                        class="input-field"
                        placeholder="Enter OTP"
                        required
                        maxlength="6"
                        pattern="\d{6}"
                    >

                </div>

                <button
                    type="submit"
                    id="verifyOtpBtn"
                    class="action-btn"
                >
                    Verify OTP
                </button>

            </div>

            <p
                id="otpError"
                class="error-message"
                style="display:none;"
            >
                Invalid OTP
            </p>

        </form>

        <!-- HELP -->

        <div class="help-section">

            <p>
                Need help?
            </p>

            <a
                href="https://wa.me/9691218959"
                target="_blank"
                style="text-decoration:none;"
            >

                <button class="whatsapp-btn">

                    <img
                        src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
                        alt="WhatsApp"
                        class="whatsapp-logo"
                    >

                    Chat with us on WhatsApp

                </button>

            </a>

        </div>

    </div>

</div>

<script>

const otpMessage =
    document.getElementById('otpMessage');

const otpError =
    document.getElementById('otpError');

/* SEND OTP */

document
.getElementById('sendOtpBtn')
.addEventListener('click', async function(){

    const mobileNumber =
        document.getElementById(
            'mobileNumber'
        ).value;

    if(!/^\d{10}$/.test(mobileNumber)){

        otpMessage.style.display = 'none';

        otpError.style.display = 'block';

        otpError.textContent =
            'Please enter a valid 10-digit mobile number.';

        return;

    }

    try{

        const response =
            await fetch('/user/send-otp',{

                method:'POST',

                headers:{
                    'Content-Type':'application/json'
                },

                body:JSON.stringify({
                    mobileNumber
                })

            });

        if(response.ok){

            otpError.style.display = 'none';

            otpMessage.style.display = 'block';

            otpMessage.textContent =
                'OTP sent successfully!';

            document
            .getElementById('mobileSection')
            .style.display = 'none';

            document
            .getElementById('otpSection')
            .style.display = 'block';

        }else{

            otpMessage.style.display = 'none';

            const error =
                await response.json();

            otpError.style.display = 'block';

            otpError.textContent =
                `Error: ${error.message}`;

        }

    }catch(error){

        otpMessage.style.display = 'none';

        otpError.style.display = 'block';

        otpError.textContent =
            'Failed to send OTP. Please try again.';

    }

});

/* VERIFY OTP */

document
.getElementById('otpForm')
.addEventListener('submit', async function(event){

    event.preventDefault();

    const mobileNumber =
        document.getElementById(
            'mobileNumber'
        ).value;

    const otp =
        document.getElementById(
            'otp'
        ).value;

    try{

        const response =
            await fetch('/user/verify-otp',{

                method:'POST',

                headers:{
                    'Content-Type':'application/json'
                },

                body:JSON.stringify({
                    mobileNumber,
                    otp
                })

            });

        if(response.ok){

            otpError.style.display = 'none';

            window.location.href =
                '/user/register';

        }else{

            otpError.style.display = 'block';

            otpError.textContent =
                'Invalid OTP. Please try again.';

        }

    }catch(error){

        otpError.style.display = 'block';

        otpError.textContent =
            'Failed to verify OTP. Please try again.';

    }

});

</script>

</body>

</html>
