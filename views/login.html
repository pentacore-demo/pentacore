<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>

/* ===== BASE ===== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#f6f8fb;
    min-height:100vh;
    overflow:hidden;
    position:relative;
}

/* ===== BACKGROUND BLOBS ===== */
.bg{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:.5;
    z-index:0;
}

.bg1{
    width:300px;
    height:300px;
    background:#c7d2fe;
    top:-80px;
    left:-80px;
}

.bg2{
    width:350px;
    height:350px;
    background:#fde68a;
    bottom:-120px;
    right:-100px;
}

.bg3{
    width:250px;
    height:250px;
    background:#bfdbfe;
    top:40%;
    left:45%;
}

/* ===== LOGIN WRAPPER ===== */
.wrapper{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    position:relative;
    z-index:2;
}

/* ===== LOGIN CARD ===== */
.login-card{
    width:100%;
    max-width:430px;
    background:rgba(255,255,255,0.78);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.7);
    border-radius:28px;
    padding:40px;
    box-shadow:
        0 20px 40px rgba(15,23,42,0.08),
        0 2px 10px rgba(15,23,42,0.04);
    animation:fade .4s ease;
}

/* ===== LOGO ===== */
.logo{
    width:72px;
    height:72px;
    border-radius:22px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
    margin-bottom:22px;
    font-size:28px;
    color:#4f46e5;
    background:linear-gradient(135deg,#eef2ff,#e0e7ff);
    border:1px solid #c7d2fe;
}

/* ===== TEXT ===== */
.login-card h1{
    text-align:center;
    font-size:30px;
    color:#0f172a;
    margin-bottom:10px;
    font-weight:700;
}

.login-card p{
    text-align:center;
    color:#64748b;
    font-size:14px;
    margin-bottom:30px;
}

/* ===== INPUTS ===== */
.input-group{
    margin-bottom:18px;
}

.input-box{
    position:relative;
}

.input-box i{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    color:#94a3b8;
    font-size:15px;
}

.input-box input{
    width:100%;
    height:56px;
    border-radius:16px;
    border:1px solid #e2e8f0;
    background:#ffffffcc;
    padding:0 18px 0 48px;
    font-size:15px;
    color:#1e293b;
    outline:none;
    transition:.25s;
}

.input-box input:focus{
    border-color:#a5b4fc;
    background:#fff;
    box-shadow:0 0 0 4px rgba(99,102,241,.08);
}

/* ===== LOGIN BUTTON ===== */
.login-btn{
    width:100%;
    height:56px;
    border:none;
    border-radius:16px;
    background:linear-gradient(135deg,#818cf8,#6366f1);
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.25s;
    margin-top:10px;
    box-shadow:0 10px 20px rgba(99,102,241,.18);
}

.login-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 30px rgba(99,102,241,.25);
}

/* ===== FOOTER ===== */
.footer{
    margin-top:24px;
    text-align:center;
    color:#94a3b8;
    font-size:13px;
}

/* ===== ANIMATION ===== */
@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ===== MOBILE ===== */
@media(max-width:500px){

    .login-card{
        padding:28px 22px;
        border-radius:24px;
    }

    .login-card h1{
        font-size:25px;
    }

    .logo{
        width:65px;
        height:65px;
        font-size:24px;
    }

}

</style>
</head>

<body>

<div class="bg bg1"></div>
<div class="bg bg2"></div>
<div class="bg bg3"></div>

<div class="wrapper">

    <div class="login-card">

        <div class="logo">
            <i class="fas fa-shield-alt"></i>
        </div>

        <h1>Admin Panel</h1>

        <p>
            Login to access your dashboard
        </p>

        <form action="/admin/login" method="POST">

            <div class="input-group">
                <div class="input-box">
                    <i class="fas fa-envelope"></i>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter Email"
                        required
                    >
                </div>
            </div>

            <div class="input-group">
                <div class="input-box">
                    <i class="fas fa-lock"></i>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter Password"
                        required
                    >
                </div>
            </div>

            <button class="login-btn" type="submit">
                Login to Dashboard
            </button>

        </form>

        <div class="footer">
            Secure Admin Access
        </div>

    </div>

</div>

</body>
</html>
